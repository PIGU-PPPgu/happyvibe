name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE: https://${{ github.repository_owner }}.github.io
      PUBLIC_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 资源库的卡片预览图不进仓库，每次构建重出：先把独立网页课件从源码内联成单文件，再用构建机自带的 Chrome 截图
      - run: python3 -c "import PIL" || (sudo apt-get update && sudo apt-get install -y python3-pil)
      - run: npm run build:interactives
      - run: npm run build:previews
        env:
          CHROME: /usr/bin/google-chrome
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
