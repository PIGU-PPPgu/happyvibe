<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太阳系 3D · 拖动倾斜视角</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #05030f; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hud { position: fixed; left: 18px; top: 16px; color: #c9bfd8; font-size: 13px; line-height: 1.9; user-select: none; }
  .hud b { color: #ffd34d; font-size: 16px; letter-spacing: .15em; }
  .hud i { font-style: normal; color: #6f6390; }
  .legend { position: fixed; right: 18px; top: 16px; text-align: right; font-size: 12px; color: #8b80a3; line-height: 1.9; user-select: none; }
  .legend s { text-decoration: none; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud"><b>太阳系 · SOLAR SYSTEM</b><br><i>按住拖动 → 倾斜视角<br>滚轮 → 缩放</i></div>
<div class="legend">
  水星<s style="background:#b8a08a"></s>　金星<s style="background:#e8c46a"></s>　地球<s style="background:#4a90d8"></s><br>
  火星<s style="background:#d86040"></s>　木星<s style="background:#d8a860"></s>　土星<s style="background:#e0c080"></s>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
function fit() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
fit(); addEventListener('resize', fit);

// 行星：半径(显示) / 轨道 / 公转速度 / 颜色
const planets = [
  { r: 3,   orbit: 70,  sp: 1.60, c: '#b8a08a', name: '水星' },
  { r: 5,   orbit: 110, sp: 1.17, c: '#e8c46a', name: '金星' },
  { r: 5.5, orbit: 155, sp: 1.00, c: '#4a90d8', name: '地球' },
  { r: 4.5, orbit: 200, sp: 0.80, c: '#d86040', name: '火星' },
  { r: 14,  orbit: 275, sp: 0.44, c: '#d8a860', name: '木星' },
  { r: 12,  orbit: 360, sp: 0.32, c: '#e0c080', name: '土星', ring: true },
];
const stars = Array.from({ length: 220 }, () => ({
  x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + .3, tw: Math.random() * 6.28,
}));
let tilt = 0.62, zoom = 1, t = 0;

// 拖动倾斜 + 滚轮缩放
let drag = null;
cv.onpointerdown = e => drag = { x: e.clientX, y: e.clientY, tilt };
cv.onpointermove = e => { if (drag) tilt = Math.min(1.35, Math.max(0.08, drag.tilt + (e.clientY - drag.y) * 0.004)); };
cv.onpointerup = () => drag = null;
cv.onwheel = e => { e.preventDefault(); zoom = Math.min(2.2, Math.max(0.5, zoom * (e.deltaY < 0 ? 1.08 : 0.93))); };

function project(x, y, z) { // 简单 3D：绕 X 轴倾斜
  const yy = y * Math.cos(tilt) - z * Math.sin(tilt);
  const zz = y * Math.sin(tilt) + z * Math.cos(tilt);
  const k = 1 - zz / 1400;
  return { x: x * k, y: yy * k, k };
}

function frame() {
  t += 0.008;
  const W2 = innerWidth / 2, H2 = innerHeight / 2, Z = zoom;
  // 星空
  ctx.fillStyle = '#05030f'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    const a = .3 + .5 * Math.abs(Math.sin(t * 2 + s.tw));
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fillRect(s.x * innerWidth, s.y * innerHeight, s.s, s.s);
  }
  // 轨道
  for (const p of planets) {
    ctx.beginPath();
    for (let a = 0; a <= 6.3; a += 0.05) {
      const q = project(Math.cos(a) * p.orbit * Z, Math.sin(a) * p.orbit * Z, 0);
      const X = W2 + q.x, Y = H2 + q.y;
      a === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
    ctx.strokeStyle = 'rgba(180,130,210,.14)'; ctx.stroke();
  }
  // 太阳
  const sun = ctx.createRadialGradient(W2, H2, 4, W2, H2, 60 * Z);
  sun.addColorStop(0, '#fff6d8'); sun.addColorStop(.35, '#ffd34d'); sun.addColorStop(1, 'rgba(255,179,0,0)');
  ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(W2, H2, 60 * Z, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(W2, H2, 17 * Z, 0, 6.3); ctx.fill();
  // 行星（按深度排序）
  const drawn = planets.map((p, i) => {
    const a = t * p.sp * 2 + i * 1.3;
    const x = Math.cos(a) * p.orbit * Z, y = Math.sin(a) * p.orbit * Z;
    return { p, q: project(x, y, 0) };
  }).sort((a, b) => a.q.k - b.q.k);
  for (const { p, q } of drawn) {
    const X = W2 + q.x, Y = H2 + q.y, r = p.r * Z * q.k;
    // 土星环
    if (p.ring) {
      ctx.save(); ctx.translate(X, Y); ctx.rotate(-tilt * .6); ctx.scale(1, .38);
      ctx.beginPath(); ctx.arc(0, 0, r * 2.1, 0, 6.3);
      ctx.strokeStyle = 'rgba(224,192,128,.55)'; ctx.lineWidth = r * .55; ctx.stroke(); ctx.restore();
    }
    const g = ctx.createRadialGradient(X - r * .4, Y - r * .4, r * .1, X, Y, r);
    g.addColorStop(0, '#fff'); g.addColorStop(.25, p.c); g.addColorStop(1, '#1a1026');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(160,150,175,.75)'; ctx.font = '11px sans-serif';
    ctx.fillText(p.name, X + r + 5, Y + 4);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
