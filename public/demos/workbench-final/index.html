<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的教师工作台</title>
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#f2f0f7; color:#241a33; }
  .app { max-width:1000px; margin:0 auto; min-height:100vh; background:#fff; box-shadow:0 0 40px rgba(80,40,110,.08); }
  header { background:#750f6d; color:#fff; padding:16px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:19px; flex:1; }
  header .date { font-size:12px; opacity:.75; font-family:ui-monospace,monospace; }
  nav { display:flex; border-bottom:1px solid #e8e2f2; overflow-x:auto; }
  nav button { flex:1; padding:13px 10px; border:0; background:none; font-size:14px; color:#8b80a3; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button.on { color:#750f6d; border-bottom-color:#feb300; font-weight:700; }
  main { padding:22px 24px; }
  .page { display:none; } .page.on { display:block; }
  /* 待办 */
  .todo-add { display:flex; gap:10px; margin-bottom:18px; }
  .todo-add input { flex:1; padding:11px 14px; border:1.5px solid #d8cff0; border-radius:8px; font-size:14px; }
  .todo-add button { padding:0 22px; background:#750f6d; color:#fff; border:0; border-radius:8px; font-size:14px; cursor:pointer; }
  .todo { display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid #ece6f6; border-radius:10px; margin-bottom:9px; background:#fdfcff; }
  .todo.done .t { text-decoration:line-through; color:#b8aecb; }
  .todo .chk { width:22px; height:22px; border:2px solid #c5b8e0; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; flex-shrink:0; }
  .todo.done .chk { background:#750f6d; border-color:#750f6d; }
  .todo .t { flex:1; font-size:14.5px; }
  .todo .tag { font-size:11px; padding:2px 8px; border-radius:4px; background:#f0ecf8; color:#750f6d; }
  .todo .dl { font-size:11px; color:#b8aecb; }
  .todo .del { color:#d8b; border:0; background:none; cursor:pointer; color:#c5b8e0; font-size:16px; }
  .stat { display:flex; gap:12px; margin-bottom:18px; }
  .stat div { flex:1; background:#faf8fd; border-radius:10px; padding:12px 14px; text-align:center; }
  .stat b { display:block; font-size:22px; color:#750f6d; }
  .stat span { font-size:11px; color:#8b80a3; }
  /* 课表 */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:#faf8fd; padding:10px 8px; border:1px solid #ece6f6; color:#750f6d; font-size:12px; }
  td { padding:11px 8px; border:1px solid #f0ebf8; text-align:center; }
  td.now { background:#fff3d6; font-weight:700; border-color:#feb300; }
  /* 学生 */
  .stu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .stu { border:1px solid #ece6f6; border-radius:12px; padding:14px; cursor:pointer; background:#fdfcff; }
  .stu:hover { border-color:#750f6d; }
  .stu h4 { font-size:15px; margin-bottom:5px; }
  .stu p { font-size:12px; color:#8b80a3; line-height:1.6; }
  .detail { position:fixed; inset:0; background:rgba(36,26,51,.45); display:none; align-items:center; justify-content:center; padding:20px; }
  .detail.on { display:flex; }
  .detail .card2 { background:#fff; border-radius:16px; padding:26px; max-width:400px; width:100%; }
  .detail h3 { color:#750f6d; margin-bottom:10px; }
  .detail li { margin:6px 0 6px 1.2em; font-size:14px; }
  /* 作业 */
  .hw-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px dashed #ece6f6; font-size:14px; }
  .hw-row .n { width:70px; }
  .bar { flex:1; height:9px; background:#f0ebf8; border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#a63d97,#feb300); border-radius:5px; }
  .hw-row .v { width:56px; text-align:right; font-family:ui-monospace,monospace; font-size:13px; }
  /* 备忘 */
  textarea { width:100%; min-height:220px; border:1.5px solid #d8cff0; border-radius:10px; padding:14px; font-size:14px; line-height:1.8; font-family:inherit; resize:vertical; }
  .saved { color:#2e7d32; font-size:12px; margin-top:8px; opacity:0; transition:opacity .3s; }
  .saved.on { opacity:1; }
  footer { text-align:center; font-size:11px; color:#c5b8e0; padding:16px; border-top:1px solid #f0ebf8; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>我的教师工作台</h1>
    <span class="date" id="today"></span>
  </header>
  <nav id="nav">
    <button class="on" data-p="todo">今日待办</button>
    <button data-p="sche">本周课表</button>
    <button data-p="stu">学生速查</button>
    <button data-p="hw">作业统计</button>
    <button data-p="memo">快速备忘</button>
  </nav>
  <main>
    <section class="page on" id="p-todo">
      <div class="stat">
        <div><b id="s-left">0</b><span>待完成</span></div>
        <div><b id="s-done">0</b><span>已完成</span></div>
        <div><b id="s-rate">0%</b><span>完成率</span></div>
      </div>
      <div class="todo-add">
        <input id="t-in" placeholder="添加一条待办…（回车确认）">
        <button onclick="addTodo()">添加</button>
      </div>
      <div id="t-list"></div>
    </section>

    <section class="page" id="p-sche">
      <p style="font-size:12px;color:#8b80a3;margin-bottom:12px;">高亮 = 今天（演示按周四显示）</p>
      <table id="sche-t"></table>
    </section>

    <section class="page" id="p-stu">
      <div class="stu-grid" id="stu-g"></div>
    </section>

    <section class="page" id="p-hw">
      <p style="font-size:13px;margin-bottom:14px;color:#8b80a3;">本周作业提交率（数学 / 英语）</p>
      <div id="hw-list"></div>
    </section>

    <section class="page" id="p-memo">
      <textarea id="memo-t" placeholder="想到什么记什么…（自动保存在本机，关掉再开还在）"></textarea>
      <p class="saved" id="memo-s">✓ 已自动保存</p>
    </section>
  </main>
  <footer>教师工作台 · 模拟数据演示 · 《任务二》真实产出一例</footer>
</div>

<div class="detail" id="stu-detail" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="card2">
    <h3 id="d-name"></h3>
    <ul id="d-list"></ul>
    <button onclick="document.getElementById('stu-detail').classList.remove('on')"
      style="margin-top:16px;padding:9px 22px;background:#750f6d;color:#fff;border:0;border-radius:8px;cursor:pointer;">关闭</button>
  </div>
</div>

<script>
const KEY = 'wb-demo-v1';
const DEF = {
  todos: [
    { t:'收秋季研学回执', tag:'材料', dl:'周五前', d:false },
    { t:'批改第二单元测试卷', tag:'作业', dl:'周三前', d:true },
    { t:'准备家长会 PPT', tag:'会议', dl:'下周二', d:false },
    { t:'跟进同学05 英语补差计划', tag:'学生', dl:'持续', d:false },
    { t:'更新黑板报（国庆主题）', tag:'班务', dl:'本周', d:false },
  ],
  memo: '下周三提醒：教室灯光报修还没人来\n家长会先问年级重点，再定我的部分\n同学09 最近状态回升，找机会表扬',
};
let S = load();
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || DEF; } catch { return DEF; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

// 日期
const d = new Date();
document.getElementById('today').textContent = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} 周${'日一二三四五六'[d.getDay()]}`;

// 导航（支持 ?tab= 直达某页签，便于演示分享）
const go = p => {
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  document.querySelectorAll('.page').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
};
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.p);
const _t = new URLSearchParams(location.search).get('tab');
if (_t) go(_t);
if (false) {
  document.querySelectorAll('#nav button').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
}


// 待办
function renderTodo(){
  const el = document.getElementById('t-list');
  el.innerHTML = S.todos.map((x,i) => `
    <div class="todo ${x.d?'done':''}">
      <div class="chk" onclick="tg(${i})">${x.d?'✓':''}</div>
      <span class="t">${x.t}</span>
      <span class="tag">${x.tag}</span>
      <span class="dl">${x.dl}</span>
      <button class="del" onclick="del(${i})">✕</button>
    </div>`).join('');
  const done = S.todos.filter(x=>x.d).length;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-left').textContent = S.todos.length - done;
  document.getElementById('s-rate').textContent = S.todos.length ? Math.round(done/S.todos.length*100)+'%' : '0%';
}
function tg(i){ S.todos[i].d = !S.todos[i].d; save(); renderTodo(); }
function del(i){ S.todos.splice(i,1); save(); renderTodo(); }
function addTodo(){
  const v = document.getElementById('t-in').value.trim();
  if(!v) return;
  S.todos.push({ t:v, tag:'新加', dl:'—', d:false });
  document.getElementById('t-in').value = '';
  save(); renderTodo();
}
document.getElementById('t-in').addEventListener('keydown', e => { if(e.key==='Enter') addTodo(); });
renderTodo();

// 课表
const SCHE = [['','周一','周二','周三','周四','周五'],
['第1节','数学','语文','英语','数学','语文'],
['第2节','数学','数学','数学·信息','语文','数学'],
['第3节','英语','道法','体育','英语·外教','美术'],
['第4节','物理','英语','数学','体育','道法'],
['第5节','音乐','班会','自习','物理·实验','综合'],
['第6节','自习','课后服务','课后服务','自习','班队会']];
document.getElementById('sche-t').innerHTML = SCHE.map((r,y) =>
  '<tr>' + r.map((c,x) => y===0 ? `<th>${c}</th>` :
    (x===4 ? `<td class="now">${c}</td>` : `<td>${c}</td>`)).join('') + '</tr>').join('');

// 学生
const STU = [
  ['同学01','男','数学强 · 课堂活跃'],['同学02','女','语文好 · 安静'],
  ['同学03','男','体育特长 · 坐不住','上课易走神'],['同学04','女','均衡 · 班干部'],
  ['同学05','男','英语弱 · 认真','英语需补差'],['同学06','女','美术特长 · 内向'],
  ['同学07','男','科学迷 · 爱提问'],['同学08','女','音乐特长 · 乐于助人'],
  ['同学09','男','数学弱 · 好动','基础需巩固'],['同学10','女','各科均衡 · 发言积极'],
];
document.getElementById('stu-g').innerHTML = STU.map((s,i) => `
  <div class="stu" onclick="showStu(${i})">
    <h4>${s[0]} <small style="color:#b8aecb;font-weight:400">${s[1]}</small></h4>
    <p>${s[2]}</p>
    ${s[3]?`<p style="color:#c48b00">⚑ ${s[3]}</p>`:''}
  </div>`).join('');
window.showStu = i => {
  const s = STU[i];
  document.getElementById('d-name').textContent = `${s[0]}（${s[1]}）`;
  document.getElementById('d-list').innerHTML =
    `<li>特点：${s[2]}</li>${s[3]?`<li>需要关注：${s[3]}</li>`:''}
     <li>本周作业：${(i===8||i===4)?'有缺交，见作业统计':'全部按时提交'}</li>
     <li>近期表扬记录：${i===7?'主动帮同学补作业（周三）':'—'}</li>`;
  document.getElementById('stu-detail').classList.add('on');
};

// 作业
const HW = [
  ['同学01',3,3],['同学02',3,3],['同学03',3,3],['同学04',3,3],['同学05',3,2],
  ['同学06',3,3],['同学07',3,3],['同学08',3,3],['同学09',2,3],['同学10',3,3],
];
document.getElementById('hw-list').innerHTML = HW.map(h => {
  const pct = Math.round(h[1]/h[2]*100);
  const flag = pct < 100 ? ' style="color:#c48b00;font-weight:700"' : '';
  return `<div class="hw-row"><span class="n">${h[0]}</span>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <span class="v"${flag}>${h[1]}/${h[2]}</span></div>`;
}).join('');

// 备忘
const mt = document.getElementById('memo-t');
mt.value = S.memo || '';
let tm;
mt.addEventListener('input', () => {
  clearTimeout(tm);
  tm = setTimeout(() => {
    S.memo = mt.value; save();
    const s = document.getElementById('memo-s');
    s.classList.add('on'); setTimeout(()=>s.classList.remove('on'), 1500);
  }, 600);
});
</script>
</body>
</html>
