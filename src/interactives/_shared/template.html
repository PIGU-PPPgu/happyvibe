<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --cuhk:#6b2077;--brand:#8a3d99;--brand-line:rgba(178,120,196,.34);
  --bg:#1a0e26;--bg2:#241233;--panel:#251337;--panel2:#2e1a43;--inset:#150b20;
  --text:#f4edf9;--muted:#b3a4c9;--faint:#82729e;
  --gold:#e8b04b;--gold-soft:#f0c470;--wrong:#c97b7b;--ok:#7fbf9e;
  --line:rgba(186,136,212,.16);--line2:rgba(186,136,212,.3);--line-gold:rgba(232,176,75,.4);
  --shadow:0 10px 32px rgba(0,0,0,.5);
}
:root[data-theme=light]{
  --cuhk:#6b2077;--brand:#6b2077;--brand-line:rgba(107,32,119,.32);
  --bg:#f8f5fb;--bg2:#f0e9f7;--panel:#ffffff;--panel2:#f4eef9;--inset:#fbf9fd;
  --text:#2a1a35;--muted:#5e4d70;--faint:#8b7ca0;
  --gold:#8a6a1f;--gold-soft:#8a6a1f;--wrong:#b35b5b;--ok:#4d8a68;
  --line:rgba(107,32,119,.16);--line2:rgba(107,32,119,.32);--line-gold:rgba(138,106,31,.45);
  --shadow:0 8px 24px rgba(80,30,100,.14);
}
*{box-sizing:border-box;margin:0}
/* 键盘可达性：Tab 焦点环（鼠标点击不显示，投屏遥控器/翻页笔友好） */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
/* 舞台底：港紫径向层次（背景实现，不盖 canvas） */
#stage{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 38%,var(--bg2),var(--bg) 78%)}
#stage.pad{inset:56px 0 0 0}
#stage.pad2{inset:112px 0 0 0}
/* ---------- 顶栏 ---------- */
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bar h1{font-size:19px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
#meta{font-size:13px;color:var(--gold);white-space:nowrap;padding:3px 10px;border:1px solid var(--line-gold);border-radius:999px}
#hint{font-size:13.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
/* ---------- 按钮 ---------- */
.btn{font:inherit;font-size:14px;line-height:1;padding:9px 16px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;touch-action:manipulation;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--brand-line);color:var(--text)}
.btn[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary{background:var(--cuhk);border-color:var(--cuhk);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--brand);border-color:var(--brand);color:#fff}
#fs{margin-left:auto}
/* ---------- 教学面板 ---------- */
#teach{position:fixed;top:56px;left:0;right:0;z-index:9;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#steps{display:flex;gap:8px;flex-shrink:0}
#guide{flex:1;min-width:0;font-size:14px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#kbd{flex-shrink:0;font-size:12px;color:var(--faint);letter-spacing:.04em}
#kbd b{font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;margin:0 1px}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:2px}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cuhk),var(--brand));transition:width .25s}
/* ---------- 讲解弹层 ---------- */
#note{position:fixed;top:132px;left:18px;z-index:20;width:min(520px,calc(100vw - 40px));padding:16px 20px;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--cuhk);border-radius:12px;box-shadow:var(--shadow);font-size:15px;line-height:1.85;display:none}
#note::before{content:'讲解';display:block;font-size:12.5px;color:var(--brand);letter-spacing:.12em;margin-bottom:6px}
:root[data-theme=light] #note::before{color:var(--cuhk)}
/* ---------- 小结浮层 ---------- */
#summary{position:fixed;top:132px;left:50%;transform:translateX(-50%);z-index:20;width:min(600px,calc(100vw - 40px));padding:18px 22px;background:var(--panel);border:1px solid var(--line-gold);border-radius:12px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.85;display:none}
#summary::before{content:'小结';display:block;font-size:12.5px;color:var(--gold);letter-spacing:.12em;margin-bottom:6px}
/* ---------- 随堂检测 ---------- */
#quiz-wrap{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(4px)}
#quiz{width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;padding:22px 26px;background:var(--panel);border:1px solid var(--brand-line);border-radius:14px;box-shadow:var(--shadow)}
#quiz-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
#quiz-head b{font-size:17px}
#quiz-prog{font-size:13px;color:var(--faint)}
#quiz-close{margin-left:auto}
#quiz-q{font-size:16.5px;line-height:1.7;margin-bottom:14px}
#quiz-opts{display:flex;flex-direction:column;gap:10px}
.qopt{font:inherit;font-size:15px;line-height:1.6;text-align:left;padding:11px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--inset);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
.qopt:not(:disabled):hover{border-color:var(--brand)}
.qopt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--inset))}
.qopt.no{border-color:var(--wrong);background:color-mix(in srgb,var(--wrong) 14%,var(--inset))}
.qopt:disabled{cursor:default}
#quiz-why{margin-top:14px;padding:12px 16px;border-left:3px solid var(--gold);background:var(--inset);border-radius:0 10px 10px 0;font-size:14.5px;line-height:1.8;color:var(--muted);display:none}
#quiz-why::before{content:'解析';display:block;font-size:12px;color:var(--gold);letter-spacing:.12em;margin-bottom:4px}
#quiz-foot{display:flex;align-items:center;gap:10px;margin-top:16px}
#quiz-score{font-size:15px}
#quiz-score b{font-size:22px;color:var(--brand)}
:root[data-theme=light] #quiz-score b{color:var(--cuhk)}
@media (max-width:860px){
  #hint,#meta,#kbd{display:none}
}
</style>
</head>
<body>
<div id="bar">
  <h1>__TITLE__</h1>
  <span id="meta"></span>
  <span id="hint">__HINT__</span>
  <button class="btn" id="theme" type="button" aria-label="切换深浅色">深浅</button>
  <button class="btn" id="fs" type="button" aria-label="全屏">全屏</button>
</div>
<div id="teach" hidden>
  <div id="steps"></div>
  <p id="guide"></p>
  <span id="kbd"><b>←</b><b>→</b> 切环节</span>
  <button class="btn" id="note-btn" type="button" hidden>讲解</button>
  <button class="btn" id="quiz-btn" type="button" hidden>检测</button>
  <button class="btn" id="summary-btn" type="button">小结</button>
  <span id="prog"><i></i></span>
</div>
<div id="note"></div>
<div id="summary"></div>
<div id="quiz-wrap">
  <div id="quiz" data-hv-quiz>
    <div id="quiz-head">
      <b>随堂检测</b>
      <span id="quiz-prog"></span>
      <button class="btn" id="quiz-close" type="button">关闭</button>
    </div>
    <div id="quiz-q"></div>
    <div id="quiz-opts"></div>
    <div id="quiz-why"></div>
    <div id="quiz-foot">
      <span id="quiz-score"></span>
      <button class="btn primary" id="quiz-next" type="button" hidden>下一题</button>
      <button class="btn primary" id="quiz-redo" type="button" hidden>重做</button>
    </div>
  </div>
</div>
<div id="stage" class="pad"></div>
<script>__BUNDLE__</script>
</body>
</html>
