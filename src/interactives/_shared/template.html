<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#150e22;--bg2:#1a1128;--panel:#1e1433;--panel2:#271a42;--inset:#120c1e;
  --text:#f2ecf8;--muted:#a99cc0;--faint:#7d7099;
  --purple:#a63d97;--gold:#feb300;--gold-soft:#ffd34d;
  --line:rgba(180,130,210,.16);--line2:rgba(180,130,210,.28);--line-gold:rgba(254,179,0,.38);
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
:root[data-theme=light]{
  --bg:#f7f4fb;--bg2:#f1ecf8;--panel:#ffffff;--panel2:#f3eefb;--inset:#faf8fd;
  --text:#241a33;--muted:#5e5275;--faint:#8b80a3;
  --purple:#8a2f7d;--gold:#b8860b;--gold-soft:#8a6a1f;
  --line:rgba(90,50,120,.16);--line2:rgba(90,50,120,.3);--line-gold:rgba(160,110,10,.45);
  --shadow:0 8px 24px rgba(80,40,110,.12);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
/* 舞台底：极淡的径向层次，避免死黑（用背景实现，绝不盖住 canvas） */
#stage{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 38%,var(--bg2),var(--bg) 78%)}
#stage.pad{inset:56px 0 0 0}
#stage.pad2{inset:112px 0 0 0}
/* ---------- 顶栏 ---------- */
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bar h1{font-size:19px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
#meta{font-size:13px;color:var(--gold);white-space:nowrap;padding:3px 10px;border:1px solid var(--line-gold);border-radius:999px}
#hint{font-size:13.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
/* ---------- 按钮 ---------- */
.btn{font:inherit;font-size:14px;line-height:1;padding:9px 16px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;touch-action:manipulation;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--line-gold);color:var(--text)}
.btn[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#241a00;font-weight:600}
:root[data-theme=light] .btn[aria-pressed=true]{color:#fff;background:var(--purple);border-color:var(--purple)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#241a00;font-weight:600}
#fs{margin-left:auto}
/* ---------- 教学面板 ---------- */
#teach{position:fixed;top:56px;left:0;right:0;z-index:9;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#steps{display:flex;gap:8px;flex-shrink:0}
#guide{flex:1;min-width:0;font-size:14px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#summary-btn{flex-shrink:0}
/* ---------- 小结浮层 ---------- */
#summary{position:fixed;top:132px;left:50%;transform:translateX(-50%);z-index:20;width:min(600px,calc(100vw - 40px));padding:18px 22px;background:var(--panel);border:1px solid var(--line-gold);border-radius:12px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.85;display:none}
#summary::before{content:'小结';display:block;font-size:12.5px;color:var(--gold);letter-spacing:.12em;margin-bottom:6px}
@media (max-width:860px){
  #hint{display:none}
  #meta{display:none}
}
</style>
</head>
<body>
<div id="bar">
  <h1>__TITLE__</h1>
  <span id="meta"></span>
  <span id="hint">__HINT__</span>
  <button class="btn" id="theme" type="button" aria-label="切换深浅色">深浅</button>
  <button class="btn" id="fs" type="button" aria-label="全屏">全屏</button>
</div>
<div id="teach" hidden>
  <div id="steps"></div>
  <p id="guide"></p>
  <button class="btn" id="summary-btn" type="button">小结</button>
</div>
<div id="summary"></div>
<div id="stage" class="pad"></div>
<script>__BUNDLE__</script>
</body>
</html>
