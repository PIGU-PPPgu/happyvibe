<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知新学校上课提醒</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #f5eef8 0%, #ede0f2 50%, #e8d5ef 100%);
    min-height: 100vh;
    color: #2d1b2e;
  }

  /* ===== 顶部导航栏 ===== */
  .topbar {
    background: linear-gradient(90deg, #750D6D 0%, #8B1A82 50%, #750D6D 100%);
    padding: 12px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(117,13,109,0.3);
    position: relative;
  }
  .topbar::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #E7AF00, #FFD700, #E7AF00);
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .school-logo {
    height: 52px;
    width: auto;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .topbar-title {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .topbar-title small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 1px;
    opacity: 0.75;
    margin-top: 2px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .topbar-time {
    color: #FFD700;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
    font-family: inherit;
  }
  .btn-gold {
    background: linear-gradient(135deg, #E7AF00, #D49A00);
    color: #fff;
    box-shadow: 0 2px 8px rgba(231,175,0,0.3);
  }
  .btn-gold:hover {
    background: linear-gradient(135deg, #FFD700, #E7AF00);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(231,175,0,0.4);
  }
  .btn-outline {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .btn-outline:hover {
    background: rgba(255,255,255,0.22);
  }
  .btn-purple {
    background: linear-gradient(135deg, #750D6D, #8B1A82);
    color: #fff;
  }
  .btn-purple:hover {
    background: linear-gradient(135deg, #8B1A82, #A02090);
  }
  .btn-gray {
    background: #e8dff0;
    color: #6b4d75;
  }
  .btn-gray:hover { background: #dccce6; }
  .btn-success { background: #2d8a4e; color: #fff; }
  .btn-success:hover { background: #256e3f; }
  .btn-warning { background: #c77b00; color: #fff; }
  .btn-warning:hover { background: #a86600; }

  /* ===== 主体容器 ===== */
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  /* ===== 通用卡片 ===== */
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(117,13,109,0.1);
    border: 1px solid rgba(117,13,109,0.08);
  }

  /* ===== 下一节课 ===== */
  .next-class-card {
    padding: 26px 28px;
    margin-bottom: 16px;
    text-align: center;
    display: none;
    border-top: 4px solid #E7AF00;
    position: relative;
    overflow: hidden;
  }
  .next-class-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(231,175,0,0.08) 0%, transparent 70%);
  }
  .next-class-card .label {
    color: #9b7aab;
    font-size: 13px;
    margin-bottom: 8px;
    letter-spacing: 3px;
    font-weight: 600;
  }
  .next-class-card .class-name {
    font-size: 38px;
    font-weight: 800;
    color: #750D6D;
    margin-bottom: 6px;
  }
  .next-class-card .class-time {
    font-size: 16px;
    color: #8a6b99;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .next-class-card .countdown {
    font-size: 15px;
    color: #750D6D;
    font-weight: 700;
  }
  .next-class-card .countdown.urgent { color: #c77b00; }

  /* ===== 名言区 ===== */
  .quote-card {
    padding: 30px 36px;
    margin-bottom: 16px;
    text-align: center;
    position: relative;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .quote-card::before {
    content: '"';
    position: absolute;
    top: -8px;
    left: 16px;
    font-size: 90px;
    color: rgba(231,175,0,0.15);
    font-family: Georgia, serif;
    line-height: 1;
    font-weight: 700;
  }
  .quote-text {
    font-size: 19px;
    color: #4a2d55;
    line-height: 1.7;
    font-weight: 500;
    margin-bottom: 12px;
    max-width: 700px;
    transition: opacity 0.6s ease;
  }
  .quote-author {
    font-size: 14px;
    color: #9b7aab;
    font-style: italic;
    transition: opacity 0.6s ease;
    font-weight: 500;
  }
  .quote-dots {
    position: absolute;
    bottom: 10px;
    display: flex;
    gap: 5px;
  }
  .quote-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #e0d0e8;
    transition: all 0.3s;
  }
  .quote-dot.active {
    background: #750D6D;
    width: 16px;
    border-radius: 3px;
  }

  /* ===== 今日课表 ===== */
  .today-schedule {
    padding: 20px 26px;
    margin-bottom: 16px;
    display: none;
  }
  .today-schedule h2 {
    font-size: 16px;
    color: #750D6D;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 2px solid #f0e0f5;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .today-schedule h2::before {
    content: '';
    width: 4px;
    height: 18px;
    background: linear-gradient(180deg, #E7AF00, #750D6D);
    border-radius: 2px;
  }
  .schedule-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f8f0fa;
  }
  .schedule-item:last-child { border-bottom: none; }
  .schedule-item .time-range {
    width: 150px;
    color: #6b4d75;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .schedule-item .class-tag {
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .tag-class1 { background: #f0e0f5; color: #750D6D; }
  .tag-class5 { background: #fff5e0; color: #b8860b; }
  .tag-meeting { background: #ffe0e0; color: #b03030; }
  .tag-other { background: #e0f5e8; color: #2d7a4a; }
  .schedule-item.past { opacity: 0.35; }
  .schedule-item.current .class-tag {
    box-shadow: 0 0 0 2.5px #750D6D;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2.5px #750D6D; }
    50% { box-shadow: 0 0 0 5px rgba(117,13,109,0.25); }
  }
  .empty-state {
    text-align: center;
    color: #b8a0c0;
    padding: 24px 0;
    font-size: 14px;
  }

  /* ===== 底部两栏 ===== */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 700px) {
    .bottom-grid { grid-template-columns: 1fr; }
  }

  /* ===== 待办事项 ===== */
  .todo-panel {
    padding: 22px 24px;
  }
  .panel-title {
    font-size: 16px;
    color: #750D6D;
    margin-bottom: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '';
    width: 4px;
    height: 18px;
    background: linear-gradient(180deg, #E7AF00, #750D6D);
    border-radius: 2px;
  }
  .panel-title .badge {
    background: #750D6D;
    color: #fff;
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 10px;
    font-weight: 600;
  }
  .todo-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .todo-input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid #e0d0e8;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    color: #2d1b2e;
  }
  .todo-input:focus { border-color: #750D6D; }
  .todo-add-btn {
    padding: 10px 18px;
    background: linear-gradient(135deg, #750D6D, #8B1A82);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .todo-add-btn:hover {
    background: linear-gradient(135deg, #8B1A82, #A02090);
  }
  .todo-list {
    max-height: 260px;
    overflow-y: auto;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid #f8f0fa;
    transition: background 0.2s;
  }
  .todo-item:hover { background: #faf5fc; }
  .todo-item:last-child { border-bottom: none; }
  .todo-checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid #c8b0d4;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    background: #fff;
  }
  .todo-checkbox:hover { border-color: #750D6D; }
  .todo-checkbox.checked {
    background: #2d8a4e;
    border-color: #2d8a4e;
  }
  .todo-checkbox.checked::after {
    content: '✓';
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .todo-text {
    flex: 1;
    font-size: 14px;
    color: #3d2545;
    word-break: break-all;
  }
  .todo-item.done .todo-text {
    text-decoration: line-through;
    color: #b8a0c0;
  }
  .todo-delete {
    background: none;
    border: none;
    color: #d0b8d8;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    border-radius: 5px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .todo-delete:hover { color: #c73030; background: #ffe0e0; }
  .todo-footer {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0e0f5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #a088ad;
  }
  .todo-clear-btn {
    background: none;
    border: none;
    color: #a088ad;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    text-decoration: underline;
  }
  .todo-clear-btn:hover { color: #c73030; }

  /* ===== 番茄钟 ===== */
  .pomodoro-panel {
    padding: 22px 24px;
    text-align: center;
  }
  .pomodoro-mode {
    display: inline-flex;
    background: #f0e0f5;
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .pomodoro-mode-btn {
    padding: 6px 16px;
    border: none;
    background: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    color: #9b7aab;
    font-family: inherit;
  }
  .pomodoro-mode-btn.active {
    background: #fff;
    color: #750D6D;
    box-shadow: 0 2px 6px rgba(117,13,109,0.15);
  }
  .pomodoro-mode-btn.active.break-mode { color: #2d8a4e; }
  .pomodoro-timer {
    font-size: 60px;
    font-weight: 800;
    color: #750D6D;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .pomodoro-timer.break-color { color: #2d8a4e; }
  .pomodoro-status {
    font-size: 14px;
    color: #9b7aab;
    margin-bottom: 18px;
    min-height: 20px;
  }
  .pomodoro-progress {
    width: 100%;
    height: 5px;
    background: #f0e0f5;
    border-radius: 3px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .pomodoro-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #750D6D, #E7AF00);
    border-radius: 3px;
    transition: width 1s linear;
    width: 0%;
  }
  .pomodoro-progress-bar.break-color { background: linear-gradient(90deg, #2d8a4e, #6bc78a); }
  .pomodoro-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .pomodoro-buttons .btn {
    padding: 10px 24px;
    font-size: 14px;
    border-radius: 8px;
  }
  .pomodoro-stats {
    font-size: 12px;
    color: #a088ad;
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .pomodoro-stats span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ===== 弹窗通用 ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(45,27,46,0.65);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(5px);
  }
  .modal-overlay.active { display: flex; }

  /* 提醒弹窗 */
  .reminder-modal {
    background: #fff;
    border-radius: 20px;
    padding: 44px 56px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 24px 70px rgba(0,0,0,0.35);
    border-top: 5px solid #E7AF00;
  }
  @keyframes popIn {
    from { transform: scale(0.75); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .reminder-modal .icon-bell {
    font-size: 56px;
    margin-bottom: 12px;
    animation: ring 1s infinite;
    display: inline-block;
  }
  @keyframes ring {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(15deg); }
    40% { transform: rotate(-15deg); }
    60% { transform: rotate(10deg); }
    80% { transform: rotate(-10deg); }
  }
  .reminder-modal .reminder-title {
    font-size: 18px;
    color: #9b7aab;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .reminder-modal .reminder-class {
    font-size: 48px;
    font-weight: 800;
    color: #750D6D;
    margin-bottom: 12px;
  }
  .reminder-modal .reminder-time {
    font-size: 17px;
    color: #8a6b99;
    margin-bottom: 30px;
    font-variant-numeric: tabular-nums;
  }
  .reminder-modal .btn {
    padding: 13px 50px;
    font-size: 17px;
    border-radius: 10px;
  }

  /* 编辑面板 */
  .edit-modal {
    background: #fff;
    border-radius: 16px;
    padding: 26px 28px;
    max-width: 700px;
    width: 95%;
    max-height: 88vh;
    overflow-y: auto;
    animation: popIn 0.3s ease;
    border-top: 4px solid #750D6D;
  }
  .edit-modal h2 {
    font-size: 20px;
    margin-bottom: 16px;
    color: #750D6D;
    font-weight: 700;
  }
  .edit-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .edit-tab {
    padding: 8px 16px;
    border-radius: 8px;
    background: #f5eef8;
    color: #6b4d75;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    border: none;
    transition: all 0.2s;
    font-family: inherit;
  }
  .edit-tab.active { background: #750D6D; color: #fff; }
  .edit-class-list { margin-bottom: 14px; }
  .edit-class-item {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    background: #faf5fc;
    border-radius: 10px;
    margin-bottom: 7px;
  }
  .edit-class-item input {
    padding: 8px 10px;
    border: 1px solid #e0d0e8;
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    color: #2d1b2e;
  }
  .edit-class-item input:focus { border-color: #750D6D; }
  .edit-class-item input[type="time"] { width: 110px; }
  .edit-class-item input[type="text"] { flex: 1; min-width: 80px; }
  .edit-class-item .sep { color: #b8a0c0; font-size: 13px; }
  .edit-class-item .delete-btn {
    background: none;
    border: none;
    color: #c73030;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    border-radius: 5px;
  }
  .edit-class-item .delete-btn:hover { background: #ffe0e0; }
  .edit-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding-top: 16px;
    border-top: 2px solid #f0e0f5;
  }
  .add-btn {
    width: 100%;
    padding: 11px;
    border: 2px dashed #c8b0d4;
    border-radius: 10px;
    background: none;
    color: #9b7aab;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 14px;
    transition: all 0.2s;
    font-family: inherit;
    font-weight: 600;
  }
  .add-btn:hover { border-color: #750D6D; color: #750D6D; background: #faf5fc; }
  .edit-hint {
    font-size: 12px;
    color: #a088ad;
    margin-bottom: 12px;
    line-height: 1.6;
  }

  /* 滚动条 */
  .todo-list::-webkit-scrollbar { width: 5px; }
  .todo-list::-webkit-scrollbar-track { background: transparent; }
  .todo-list::-webkit-scrollbar-thumb { background: #d0b8d8; border-radius: 3px; }
</style>
</head>
<body>

<!-- 顶部导航栏 -->

function timeToMinutes(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }

function formatCountdown(minutes) {
  if (minutes < 0) return "已上课";
  if (minutes === 0) return "即将开始";
  const h = Math.floor(minutes/60), m = minutes%60;
  if (h > 0) return "还有 " + h + " 小时 " + m + " 分钟";
  return "还有 " + m + " 分钟";
}

function getTagClass(name) {
  if (name.includes('1') && name.includes('班')) return 'tag-class1';
  if (name.includes('5') && name.includes('班')) return 'tag-class5';
  if (name.includes('班会')) return 'tag-meeting';
  return 'tag-other';
}

// ==================== 声音 ====================
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { console.warn('不支持音频', e); }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playChime() {
  ensureAudio();
  if (!audioCtx) return;
  const notes = [880, 1100, 880];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    const t0 = audioCtx.currentTime + i * 0.35;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.35, t0 + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
    osc.start(t0); osc.stop(t0 + 0.35);
  });
}

function playPomodoroChime() {
  ensureAudio();
  if (!audioCtx) return;
  const notes = [660, 880, 1100];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'triangle';
    const t0 = audioCtx.currentTime + i * 0.25;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.3, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
    osc.start(t0); osc.stop(t0 + 0.5);
  });
}

// ==================== 主更新 ====================
function update() {
  const now = new Date();
  const dayOfWeek = now.getDay();
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const dateKey = now.toDateString();

  if (dateKey !== lastReminderDate) {
    lastReminderDate = dateKey;
    remindedToday.clear();
  }

  document.getElementById('currentTime').textContent =
    now.toLocaleTimeString('zh-CN', { hour12: false });

  const nextCard = document.getElementById('nextClassCard');
  const todaySched = document.getElementById('todaySchedule');

  if (dayOfWeek === 0 || dayOfWeek === 6) {
    nextCard.style.display = 'none';
    todaySched.style.display = 'none';
    return;
  }

  const todayClasses = (schedule[dayOfWeek] || [])
    .slice()
    .sort((a,b) => timeToMinutes(a.start) - timeToMinutes(b.start));

  for (const cls of todayClasses) {
    const startMin = timeToMinutes(cls.start);
    const remindMin = startMin - 10;
    const classId = dayOfWeek + '-' + cls.start + '-' + cls.name;
    if (nowMinutes >= remindMin && nowMinutes < startMin && !remindedToday.has(classId)) {
      remindedToday.add(classId);
      showReminder(cls);
    }
  }

  let nextClass = null;
  for (const cls of todayClasses) {
    if (timeToMinutes(cls.start) > nowMinutes) { nextClass = cls; break; }
  }
  if (nextClass) {
    nextCard.style.display = 'block';
    document.getElementById('nextClassName').textContent = nextClass.name;
    document.getElementById('nextClassTime').textContent = nextClass.start + ' - ' + nextClass.end;
    const diff = timeToMinutes(nextClass.start) - nowMinutes;
    const cdEl = document.getElementById('nextCountdown');
    cdEl.textContent = formatCountdown(diff);
    cdEl.className = 'countdown' + (diff <= 10 ? ' urgent' : '');
  } else {
    nextCard.style.display = 'none';
  }

  todaySched.style.display = 'block';
  document.getElementById('todayTitle').textContent = WEEK_NAMES[dayOfWeek] + '课表';
  const listEl = document.getElementById('scheduleList');
  if (todayClasses.length === 0) {
    listEl.innerHTML = '<div class="empty-state">今日无课</div>';
  } else {
    listEl.innerHTML = todayClasses.map(cls => {
      const s = timeToMinutes(cls.start), e = timeToMinutes(cls.end);
      let status = '';
      if (nowMinutes >= e) status = 'past';
      else if (nowMinutes >= s) status = 'current';
      return '<div class="schedule-item ' + status + '">' +
        '<span class="time-range">' + cls.start + ' - ' + cls.end + '</span>' +
        '<span class="class-tag ' + getTagClass(cls.name) + '">' + cls.name + '</span>' +
      '</div>';
    }).join('');
  }
}

let todos = [];

function loadTodos() {
  const saved = localStorage.getItem('todos_v1');
  if (saved) {
    try { todos = JSON.parse(saved); return; } catch(e) {}
  }

function addTodo() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) return;
  todos.push({ id: Date.now(), text: text, done: false });
  input.value = '';
  persistTodos();
  renderTodos();
}

function toggleTodo(id) {
  const t = todos.find(t => t.id === id);
  if (t) { t.done = !t.done; persistTodos(); renderTodos(); }
}

function deleteTodo(id) {
  todos = todos.filter(t => t.id !== id);
  persistTodos();
  renderTodos();
}

function clearCompleted() {
  if (!todos.some(t => t.done)) return;
  if (confirm('确定清除所有已完成的待办？')) {
    todos = todos.filter(t => !t.done);
    persistTodos();
    renderTodos();
  }
}

function renderTodos() {
  const listEl = document.getElementById('todoList');
  const pending = todos.filter(t => !t.done).length;
  document.getElementById('todoBadge').textContent = pending;
  document.getElementById('todoStats').textContent =
    '共 ' + todos.length + ' 项，已完成 ' + (todos.length - pending) + ' 项';

  if (todos.length === 0) {
    listEl.innerHTML = '<div class="empty-state">暂无待办事项</div>';
    return;
  }
  const sorted = todos.slice().sort((a,b) => a.done - b.done);
  listEl.innerHTML = sorted.map(t =>
    '<div class="todo-item ' + (t.done ? 'done' : '') + '">' +
      '<div class="todo-checkbox ' + (t.done ? 'checked' : '') + '" onclick="toggleTodo(' + t.id + ')"></div>' +
      '<span class="todo-text">' + escapeHtml(t.text) + '</span>' +
      '<button class="todo-delete" onclick="deleteTodo(' + t.id + ')" title="删除">✕</button>' +
    '</div>'
  ).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 番茄钟 ====================
const POMODORO_WORK = 25 * 60;
const POMODORO_BREAK = 5 * 60;
let pomodoroMode = 'work';
let pomodoroTimeLeft = POMODORO_WORK;
let pomodoroRunning = false;
let pomodoroInterval = null;
let pomodoroCount = 0;

function loadPomodoroCount() {
  const today = new Date().toDateString();
  const saved = localStorage.getItem('pomodoro_count_v1');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data.date === today) pomodoroCount = data.count;
      else pomodoroCount = 0;
    } catch(e) { pomodoroCount = 0; }
  }
  document.getElementById('pomodoroCount').textContent = pomodoroCount;
}

function persistPomodoroCount() {
  localStorage.setItem('pomodoro_count_v1', JSON.stringify({
    date: new Date().toDateString(),
    count: pomodoroCount
  }));
}

function formatPomodoroTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updatePomodoroDisplay() {
  document.getElementById('pomodoroTimer').textContent = formatPomodoroTime(pomodoroTimeLeft);
  const total = pomodoroMode === 'work' ? POMODORO_WORK : POMODORO_BREAK;
  const progress = ((total - pomodoroTimeLeft) / total) * 100;
  document.getElementById('pomodoroProgress').style.width = progress + '%';

  const timerEl = document.getElementById('pomodoroTimer');
  const progressEl = document.getElementById('pomodoroProgress');
  const isBreak = pomodoroMode === 'break';
  timerEl.classList.toggle('break-color', isBreak);
  progressEl.classList.toggle('break-color', isBreak);

  const statusEl = document.getElementById('pomodoroStatus');
  if (pomodoroRunning) {
    statusEl.textContent = isBreak ? '休息中...放松一下' : '专注中...保持专注';
  } else {
    statusEl.textContent = isBreak ? '准备开始休息' : '准备开始专注';
  }

  document.getElementById('pomodoroStartBtn').textContent = pomodoroRunning ? '暂停' : '开始';
  document.getElementById('pomodoroStartBtn').className =
    'btn ' + (pomodoroRunning ? 'btn-warning' : 'btn-success');
}

function togglePomodoro() {
  if (pomodoroRunning) pausePomodoro();
  else startPomodoro();
}

function startPomodoro() {
  ensureAudio();
  pomodoroRunning = true;
  pomodoroInterval = setInterval(() => {
    pomodoroTimeLeft--;
    if (pomodoroTimeLeft <= 0) {
      pomodoroTimeLeft = 0;
      updatePomodoroDisplay();
      finishPomodoro();
      return;
    }
    updatePomodoroDisplay();
  }, 1000);
  updatePomodoroDisplay();
}

function pausePomodoro() {
  pomodoroRunning = false;
  if (pomodoroInterval) { clearInterval(pomodoroInterval); pomodoroInterval = null; }
  updatePomodoroDisplay();
}

function resetPomodoro() {
  pausePomodoro();
  pomodoroTimeLeft = pomodoroMode === 'work' ? POMODORO_WORK : POMODORO_BREAK;
  updatePomodoroDisplay();
}

function switchPomodoroMode(mode) {
  if (mode === pomodoroMode) return;
  pausePomodoro();
  pomodoroMode = mode;
  pomodoroTimeLeft = mode === 'work' ? POMODORO_WORK : POMODORO_BREAK;
  document.getElementById('modeWork').classList.toggle('active', mode === 'work');
  document.getElementById('modeBreak').classList.toggle('active', mode === 'break');
  document.getElementById('modeBreak').classList.toggle('break-mode', mode === 'break');
  updatePomodoroDisplay();
}

function finishPomodoro() {
  pausePomodoro();
  playPomodoroChime();

  if (pomodoroMode === 'work') {
    pomodoroCount++;
    persistPomodoroCount();
    document.getElementById('pomodoroCount').textContent = pomodoroCount;
    if (confirm('🍅 专注完成！休息 5 分钟吧？')) {
      switchPomodoroMode('break');
      startPomodoro();
    } else {
      resetPomodoro();
    }
  } else {
    if (confirm('休息结束！开始下一个专注番茄？')) {
      switchPomodoroMode('work');
      startPomodoro();
    } else {
      resetPomodoro();
    }
  }
}

// ==================== 初始化 ====================
document.addEventListener('click', function once() {
  ensureAudio();
  document.removeEventListener('click', once);
}, { once: true });

loadSchedule();
loadTodos();
loadPomodoroCount();
initQuoteDots();
showQuote(0);
renderTodos();
updatePomodoroDisplay();
update();

setInterval(nextQuote, 12000);
setInterval(update, 1000);
</script>
